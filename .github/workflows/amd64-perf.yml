name: AMD64 SIMD validation

on:
  push:
    branches: [codex/amd64-whisper-simd]

permissions:
  contents: read

jobs:
  v3:
    runs-on: ubuntu-latest
    env:
      GOAMD64: v3
      GOEXPERIMENT: simd
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: CPU
        run: lscpu | grep -E 'Model name|Architecture|Flags'
      - name: Native SIMD and executor tests
        run: go test ./internal/whispergemm ./internal/q8gemm ./internal/q8gemv ./whisper -count=5
      - name: Native packed matrix and vector benchmarks
        run: go test ./internal/whispergemm -run '^$' -bench '^(BenchmarkMul|BenchmarkScalar|BenchmarkMulVector|BenchmarkMulVectorScalar)$' -benchtime=100ms -count=3 -benchmem
      - name: Native int8 vector benchmarks
        run: go test ./internal/q8gemv -run '^$' -bench '^BenchmarkMulInto' -benchtime=100ms -count=3 -benchmem
